[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hipporag"
version = "2.0.0a5"
description = "A powerful graph-based RAG framework that enables LLMs to identify and leverage connections within new knowledge for improved retrieval."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.5.1",
    "transformers==4.45.2",
    "openai>=3.3.1,<4",
    "litellm==1.73.1",
    "networkx==3.4.2",
    "python_igraph==0.11.8",
    "tiktoken==0.7.0",
    "pydantic>=2.10.4,<3",
    "tenacity==8.5.0",
    "einops",
    "tqdm",
    "boto3",
    "nest_asyncio",
    "numpy",
    "pandas",
    "pyarrow",
    "requests",
    "scipy",
    "filelock",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
milvus = ["pymilvus[milvus_lite]>=2.4.2"]
qdrant = ["qdrant-client>=1.9"]
chroma = ["chromadb>=0.5"]
transformers-embedding = ["sentence-transformers>=3.0"]
gritlm = ["gritlm==1.0.2"]
vllm = ["vllm==0.6.6.post1", "outlines"]
mcp = ["mcp>=2.2,<3"]

[project.scripts]
hipporag-mcp = "hipporag.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
